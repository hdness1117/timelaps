.slotrow{display:flex;gap:8px;justify-content:center;margin:8px 0}.slot{width:22vw;max-width:76px;aspect-ratio:1;border:3px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:36px;color:#b9aa86;background:#fffdf7;font-family:var(--f-serif)}

.mon.glow{animation:glow 1.1s infinite alternate}@keyframes glow{to{box-shadow:0 0 36px 6px #f5c542,0 7px 0 #5f6767}}

@keyframes swing{50%{transform:rotate(-55deg)}}

.flier.puff{font-size:16px;color:#fff;font-family:var(--f-ui);animation:puff .9s forwards}@keyframes puff{to{opacity:0;margin-top:-20px}}
.ctrl{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:6px;touch-action:none}.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:4px}.dp{border:0;border-radius:12px;background:#fffdf7;border:2px solid var(--line);font-size:20px;color:var(--ink);touch-action:none;user-select:none}.dp.u{grid-column:2;grid-row:1}.dp.l{grid-column:1;grid-row:2}.dp.d{grid-column:2;grid-row:2}.dp.r{grid-column:3;grid-row:2}.mdig{margin-top:0!important;flex:1;height:108px}.btn:disabled{opacity:.45;box-shadow:none}
.stage3d{position:relative;width:100%;aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:#bfe3f5;border:3px solid #8fae7c;touch-action:none;user-select:none}.stage3d canvas{width:100%;height:100%;display:block;image-rendering:auto}.stage3d .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;color:#5a7a5a}.mbub{position:absolute;left:8px;right:8px;bottom:34px;background:#fffdf7ee;border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-family:var(--f-voice);font-size:17px;display:none;z-index:6}.mbar{position:absolute;left:25%;right:25%;bottom:14px;height:12px;background:#0007;border-radius:7px;display:none;z-index:6;overflow:hidden}.mbar i{display:block;height:100%;width:0;background:#f5c542}
.court{background:#fbf5e6}.bench{font-family:var(--f-body);font-size:20px;margin-bottom:6px}.hpbar{display:flex;justify-content:space-between;gap:8px;font-size:15px;margin:4px 0 8px;flex-wrap:wrap}.jconf{display:inline-block;width:70px;height:9px;background:#e4d6b3;border-radius:6px;vertical-align:middle;overflow:hidden}.jconf b{display:block;height:100%;background:#b8402f;transition:width .6s}
.duel{display:flex;gap:10px;align-items:flex-start;margin:8px 0}.npc{font-size:40px;text-align:center;line-height:1}.npc small{display:block;font-size:14px;color:var(--mut);font-family:var(--f-body)}.claim{flex:1;background:#fff;border:2px solid #b8402f;border-radius:14px;padding:10px 12px;font-family:var(--f-voice);font-size:19px;position:relative}
.evgrid{display:grid;grid-template-columns:1fr;gap:6px;margin:8px 0}.ev{text-align:left;background:#fffdf7;border:2px solid var(--line);border-left:5px solid var(--gold);border-radius:8px;padding:8px 10px;font-family:var(--f-body);font-size:18px;color:var(--ink);cursor:default}button.ev{cursor:pointer;width:100%}.ev.sel{border-color:#b8402f;background:#fff0e8}.ev.ok{border-color:var(--ok);background:#e8f6ee}
.stamp{display:inline-block;font-family:var(--f-ui);font-size:30px;color:#b8402f;border:4px solid #b8402f;border-radius:10px;padding:2px 14px;transform:rotate(-6deg);margin:8px 0;animation:stampin .5s}@keyframes stampin{0%{transform:scale(3) rotate(-6deg);opacity:0}100%{transform:scale(1) rotate(-6deg);opacity:1}}
.runwrap{position:relative;max-width:420px;margin:0 auto}.runwrap canvas{width:100%;display:block;border-radius:14px;border:3px solid #2d2f4f;touch-action:none;background:#1a2140}.rungo,.runretry{position:absolute;left:12%;right:12%;bottom:24px;margin:0!important;width:auto}
.lanes{display:flex;gap:10px;margin-top:10px;max-width:420px;margin-left:auto;margin-right:auto}.lanebtn{flex:1;height:64px;border:2px solid var(--line);border-radius:14px;background:#fffdf7;font-family:var(--f-ui);font-size:20px;color:var(--ink);touch-action:none;user-select:none}.lanebtn:active{background:#f3e6c0}
#snd{position:fixed;bottom:12px;right:12px;z-index:60;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:#fffdf7;font-size:20px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.15)}
#nbtn{position:fixed;bottom:12px;right:60px;z-index:60;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:#fffdf7;font-size:20px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.15)}#nmenu{position:fixed;bottom:60px;right:12px;z-index:61;display:none;background:#fffdf7;border:2px solid var(--line);border-radius:14px;padding:10px;max-width:80vw;max-height:60vh;overflow:auto;box-shadow:0 4px 12px rgba(0,0,0,.2)}.nv{display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:16px;cursor:pointer}.nv.sel{border-color:var(--red);background:#fbe7de}

#pop.obj .pbox{background:#fff0ea;border-color:#c0392b;transform:rotate(-3deg)}#pop.obj .ptx{font-size:46px;color:#c0392b;letter-spacing:2px;text-shadow:3px 3px 0 #f5c542}
@keyframes popin{0%{transform:scale(.3) rotate(-8deg);opacity:0}100%{transform:scale(1)}}
.claim{font-size:23px!important}
.dlg{display:flex;gap:10px;align-items:flex-start;margin:8px 0}.dlg.new{animation:popin .3s}.dlg .sp{font-size:34px;text-align:center;min-width:54px;line-height:1}.dlg .sp small{display:block;font-size:14px;color:var(--mut)}.dlg .bub{font-family:var(--f-voice);flex:1;background:#fff;border:2px solid var(--line);border-radius:14px;padding:9px 12px;font-size:19px}.dlg.jp .bub{border-color:#b8402f}

/* ===== v22 · 깔끔한 노트(Notion) 톤: 색은 그대로, 정보는 덜어내고 반응은 또렷하게 ===== */
:root{--paper:#fffdf8;--line2:#ebe0c6;--soft:#f6efdc;--shadow:0 1px 2px rgba(70,52,20,.07),0 6px 18px rgba(70,52,20,.05)}
body{background:linear-gradient(#e6f0f4,#f7efdc 58%) fixed;font-size:18px;line-height:1.65}
.ridge{opacity:.55}
#app{max-width:520px;padding:52px 16px 120px}
#app.wide{max-width:960px}
.card{background:var(--paper);border:1px solid var(--line2);border-radius:16px;padding:20px 18px;margin:14px 0;box-shadow:var(--shadow)}
h2{font-size:22px;line-height:1.35}h3{font-size:20px}
.title{padding:18px 0 2px}.title .sub{color:var(--mut);font-size:16px;margin:4px 0 0}
.logo{font-size:38px;letter-spacing:4px}
.btn{border-radius:12px;padding:15px;font-size:19px;box-shadow:none;margin-top:14px;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(.98);box-shadow:none}
.btn:disabled,.btn:disabled:hover{opacity:1;background:#ddd3bd;color:#fff;filter:none;transform:none;box-shadow:none}
.btn.ghost{background:transparent;color:var(--mut);border:1px solid var(--line2);box-shadow:none;font-size:16px;padding:11px}
.btn.link{background:none;border:0;color:var(--mut);font-size:15px;text-decoration:underline;padding:6px;margin-top:2px}
.btn.sm{box-shadow:none;border-radius:10px}
.opt{border:1px solid var(--line2);background:var(--paper);border-radius:12px;padding:13px 14px;margin:8px 0;font-size:18px;transition:background .12s,border-color .12s,transform .08s}
.opt:hover{background:var(--soft)}.opt:active{transform:scale(.99)}
.opt.sel{border-color:var(--red);background:#fbeee8;box-shadow:inset 3px 0 0 var(--red)}
.opt.ok{border-color:var(--ok);background:#e8f5ee;animation:okp .35s}
.opt.no{border-color:#e3b3aa;background:#fbefec;opacity:.75;animation:shk .35s}
@keyframes okp{0%{transform:scale(.97)}60%{transform:scale(1.02)}100%{transform:none}}
@keyframes shk{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
input,select,textarea{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:12px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(184,64,47,.13)}
label{font-size:15px;color:var(--mut);margin:14px 0 5px}
.track{margin:0 0 4px}.node{width:26px;height:26px;font-size:14px;border-width:1px}
.node.cur{transform:scale(1.18);box-shadow:0 0 0 4px rgba(184,64,47,.16)}.seg{height:3px;border-radius:2px}.yrs{display:none}
.tag{background:var(--soft);font-size:14px;padding:3px 10px}
.who{border:1px solid var(--line2);background:var(--paper);font-size:15px;padding:3px 11px}
.quote,.stake{background:var(--soft);border-radius:8px}
.toast{border-radius:10px}
.fb{border-radius:12px}

    cls: S.cls, team: S.team, size: S.size, phase: S.phase, cell: S.cell, step: S.step, startedAtMs: S.startedAtMs, diceBonus: S.diceBonus,

/* ---------------- 신분 정하기: 카드 뽑기 ---------------- */
function vIntro() {

  <button class="btn" data-act="introok">카드 뽑으러 가기 ▶</button></div>`;
}
function vCards() {
  if (!S.introSeen) return vIntro();
  const n = S.size, drawn = S.flipped.length, done = drawn >= n;
  const best = Math.max(...S.deck);
  const cards = S.deck.map((num, i) => { const up = S.flipped.includes(i); return `<div class="pcard ${up ? 'up' : ''} ${done && num === best ? 'best' : ''}" data-act="flip" data-i="${i}">${up ? num : '?'}</div>`; }).join('');
  const R = S.roster, left = R ? R.filter(nm => !Object.values(S.cardName || {}).includes(nm)) : [], needName = !!R && !done && !S.curName;
  const head = done ? '카드를 모두 뽑았어요! <b>가장 큰 숫자</b>를 뽑은 친구부터 신분을 고릅니다.' : needName ? '<b>내 이름</b>을 눌러 주세요. 그다음 카드를 한 장 뽑아요.' : S.curName ? `<b>${esc(S.curName)}</b> 님, 카드를 한 장 뽑으세요!` : `<b>${drawn + 1}번째</b> 학생이 카드 한 장을 뽑으세요. (기기를 돌려가며 한 명씩!)`;
  const names = needName ? `<div class="namerow">${left.map(nm => `<button class="opt namebtn" data-act="pickname" data-n="${esc(nm)}">${esc(nm)}</button>`).join('')}</div>` : '';
  return `<div class="title"><h2>🎴 누가 먼저 신분을 고를까?</h2></div>
  <div class="card"><p>${head}</p>${names}
  <div class="cards" style="${needName ? 'opacity:.35;pointer-events:none' : ''}">${cards}</div><div class="muted">뽑은 카드: ${S.flipped.map(i => S.deck[i]).join(' · ') || '아직 없어요'}</div>
  ${done ? '<button class="btn" data-act="toroles">신분 고르러 가기 ▶</button>' : ''}</div>`;
}
function rolePool() {
  const keys = S.size === 4 ? ['prince', 'yangban', 'farmer', 'slave'] : ['prince', 'yangban', 'merchant', 'farmer', 'slave'];
  if (S.size === 6) keys.push('farmer');
  return keys.map((k, i) => ({ key: k, idx: i }));
}
function vRoles() {
  const order = S.deck.map((n, i) => ({ n, i })).sort((a, b) => b.n - a.n);
  const pool = rolePool().filter(r => !S.taken.includes(r.idx));
  const cur = order[S.pickIdx];
  const rows = S.members.map(m => `<li>${m.name ? esc(m.name) + ' · ' : ''}카드 <b>${m.card}</b> → ${ROLES[m.key].em} ${m.label}</li>`).join('');
  const lbl = r => ROLES[r.key].label + (S.size === 6 && r.key === 'farmer' ? (r.idx === 3 ? ' ①' : ' ②') : '');
  return `<div class="title"><h2>🧑‍🤝‍🧑 신분 고르기</h2></div><div class="card">
  <p>${(S.cardName || {})[cur.i] ? '<b>' + esc(S.cardName[cur.i]) + '</b> 님, ' : ''}카드 <b style="font-size:24px;color:var(--red)">${cur.n}</b>번을 뽑은 학생이 고를 차례예요. (${S.pickIdx + 1}/${S.size})</p>
  ${pool.map(r => `<button class="opt rolebtn" data-act="role" data-idx="${r.idx}"><span class="em">${ROLES[r.key].em}</span><span>${lbl(r)}<br><small class="muted">말투: ${ROLES[r.key].voice}</small></span></button>`).join('')}
  <ul class="list">${rows}</ul></div>`;
}
function pickRole(idx) {
  const order = S.deck.map((n, i) => ({ n, i })).sort((a, b) => b.n - a.n);
  const r = rolePool().find(x => x.idx === idx); if (!r || S.taken.includes(idx)) return;
  const label = ROLES[r.key].label + (S.size === 6 && r.key === 'farmer' ? (idx === 3 ? ' ①' : ' ②') : '');
  S.members.push({ card: order[S.pickIdx].n, key: r.key, label, name: (S.cardName || {})[order[S.pickIdx].i] || '' }); S.taken.push(idx); S.pickIdx++;
  if (S.pickIdx === S.size - 1) { // 남은 신분은 마지막 학생에게 자동 배정
    const last = rolePool().find(x => !S.taken.includes(x.idx));
    const lab = ROLES[last.key].label + (S.size === 6 && last.key === 'farmer' ? (last.idx === 3 ? ' ①' : ' ②') : '');
    S.members.push({ card: order[S.pickIdx].n, key: last.key, label: lab, name: (S.cardName || {})[order[S.pickIdx].i] || '' }); S.taken.push(last.idx); S.pickIdx++;
  }
  if (S.pickIdx >= S.size) {
    S.members.sort((a, b) => ROLES[a.key].order - ROLES[b.key].order || a.label.localeCompare(b.label));
    S.phase = 'team';
  }
}

function track() {

  const cur = S.phase === 'board' ? S.cell + 1 : 6;
  const parts = nodes.map((n, i) => `<div class="node ${i < cur ? 'done' : ''} ${i === cur ? 'cur' : ''}">${n}</div>${i < nodes.length - 1 ? `<div class="seg ${i < cur ? 'done' : ''}"></div>` : ''}`).join('');
  return `<div class="track">${parts}</div><div class="yrs"><span>출발</span>${CELLS.map(c => `<span>${esc(c.year)}</span>`).join('')}<span>도착</span></div>`;
}
const who = m => `<span class="who">${ROLES[m.key].em} ${m.name ? esc(m.name) + ' · ' : ''}${m.label}${m.name ? '' : ` <small class="muted">(카드 ${m.card})</small>`}</span>`;

const Q_GOAL = { '표면적 질문': '사료에서 답을 찾아 골라요.', '의미 파악 질문': '사료를 근거로 이유를 모둠이 의논해 써요.', '의미 분석 질문': '내 신분의 입장에서 생각해 써요.' };
function goalBanner(c) {

  return `<div class="goal"><span class="gt">🎯 지금 할 일 · ${g[0]}</span>${esc(tx)}</div>`;
}
function vBoard() {
  const c = CELLS[S.cell], N = S.members.length;
  const head = `${track()}<div class="muted" style="text-align:center">${S.cell + 1}/${CELLS.length}칸 · ${esc(c.title)}</div>${goalBanner(c)}`;
  if (S.step === 'situation') {
    const vh = videoHtml(c.video), go = `<button class="btn" data-act="${({ mine: 'tomine', rice: 'torice', trial: 'totrial', run: 'torun' })[c.game]}">${esc(c.goBtn)}</button>`;

  }
  if (S.step === 'mine') return `${head}${vMine(c)}`;
  if (S.step === 'rice') return `${head}${vRice(c)}`;
  if (S.step === 'dig') return `${head}${vDig(c)}`;
  if (S.step === 'runintro') return `${head}${vRunIntro(c)}`;
  if (S.step === 'run') return `${head}${vRun(c)}`;
  if (S.step === 'runend') return `${head}${vRunEnd(c)}`;
  if (S.step === 'trial') return `${head}${vTrial(c)}`;
  if (S.step === 'verdict') return `${head}${vVerdict(c)}`;
  if (S.step === 'stance') {
    const m = S.members[S.mi];
    const prev = S.log.filter(l => l.cell === S.cell && l.k === 'stance').map(l => `<li>${ROLES[l.key].em} <b>${esc(l.who)}</b> — ${esc(l.opt)}<br><span class="muted">“${esc(l.a)}”</span></li>`).join('');
    return `${head}<div class="card sp"><div class="split"><div class="pane"><h3>🗣️ 입장 표명 (${S.mi + 1}/${N})</h3>${who(m)}

    return `${head}<div class="card"><h3>📣 우리 모둠의 입장들</h3><p class="muted">같은 사건, 다른 입장! 이제 사료를 읽고 시대 속 목소리를 살펴봐요.</p><ul class="list">${rows}</ul><button class="btn" data-act="tosource">${c.dig ? '⛏️ 사료 캐러 가기 ▶' : '사료 읽기 ▶'}</button></div>`;
  }
  if (S.step === 'source') return `${head}<div class="card"><h3>📜 사료 읽기</h3>${srcHtml(c)}<p class="muted">천천히 읽고, 다음 화면에서 질문에 답해요.</p><button class="btn" data-act="toq">질문 풀기 ▶</button></div>`;
  if (S.step === 'q') {

    if (!S.tmp) S.tmp = initTmp(q, ty);

        + (T.solved ? `<div class="fb ok"><b>정답!</b> ${esc(q.ex || '')}</div><button class="btn" data-act="qnext">다음 ▶</button>` : (T.bad.length ? '<div class="fb no">앗, 다시 생각해 봐요!</div>' : ''));
    } else if (ty === 'multi') {
      body = T.opts.map((o, i) => `<button class="opt ${T.sel.includes(i) ? 'sel' : ''} ${T.solved && o.ok ? 'ok' : ''}" data-act="mt" data-i="${i}" ${T.solved ? 'disabled' : ''}>${esc(o.t)}</button>`).join('')
        + (T.solved ? `<div class="fb ok"><b>정답!</b> ${esc(q.ex || '')}</div><button class="btn" data-act="qnext">다음 ▶</button>`
          : `${T.msg ? `<div class="fb no">${esc(T.msg)}</div>` : ''}<button class="btn" data-act="mcheck" ${T.sel.length === q.pick ? '' : 'disabled'}>확인 (${T.sel.length}/${q.pick})</button>`);
    } else if (ty === 'match') {
      body = q.pairs.map((pr, r) => `<div class="pairrow"><b>${esc(pr[0])}</b> → ${q.choices.map((ch, k) => `<button class="opt mini ${T.pick[r] === k ? 'sel' : ''} ${T.solved && pr[1] === ch ? 'ok' : ''}" data-act="pm" data-r="${r}" data-k="${k}" ${T.solved ? 'disabled' : ''}>${esc(ch)}</button>`).join('')}</div>`).join('')
        + (T.solved ? `<div class="fb ok"><b>정답!</b> ${esc(q.ex || '')}</div><button class="btn" data-act="qnext">다음 ▶</button>`
          : `${T.msg ? `<div class="fb no">${esc(T.msg)}</div>` : ''}<button class="btn" data-act="pcheck" ${T.pick.every(v => v >= 0) ? '' : 'disabled'}>확인</button>`);

  }

    const last = S.cell === CELLS.length - 1;
    return `${head}<div class="card" style="text-align:center"><h3>🎲 운명의 주사위</h3><div class="road">${esc(LESSON.road[S.cell + 1] || '')}</div><p>이번 주사위는 ${who(roller)} 이(가) 굴려요.<br><span class="muted">눈 1당 ${SCORE.diceSec}초 단축!</span></p>
    <div id="die" class="die">${ev ? '🎲 ' + ev : '🎲'}</div>
    ${ev ? `<div class="toast">눈 ${ev} → ${ev * SCORE.diceSec}초 단축!</div><button class="btn" data-act="nextcell">${last ? '최종 문장 쓰러 가기 ✍️' : '다음 칸으로 ▶'}</button>` : '<button class="btn" data-act="roll">주사위 굴리기</button>'}</div>`;
  }
}
const qType = q => q.pairs ? 'match' : q.pick ? 'multi' : q.o ? 'mc' : 'text';
function initTmp(q, ty) {
  if (ty === 'mc') return { opts: shuffle(q.o.map((t, i) => ({ t, ok: i === 0 }))), bad: [], solved: false };
  if (ty === 'multi') return { opts: shuffle(q.o.map((t, i) => ({ t, ok: i < q.pick }))), sel: [], solved: false, msg: '' };
  if (ty === 'match') return { pick: q.pairs.map(() => -1), solved: false, msg: '' };

  return `<div class="title"><h2>교사용 · 실시간 현황</h2></div><div class="card"><div class="row"><div><label>반</label><select id="t-cls">${[...CLASSES, 99].map(c => `<option value="${c}" ${String(c) === String(TEACH.cls) ? 'selected' : ''}>${c === 99 ? '교사 테스트' : c + '반'}</option>`).join('')}</select></div>
  <div style="align-self:end"><button class="btn ghost" data-act="home">학생 화면</button></div></div>
  <p class="muted"><span class="dot ${NET === 'ok' ? 'ok' : NET === 'fail' ? 'fail' : ''}"></span>${NET === 'fail' ? '연결 실패 — 네트워크/규칙을 확인하세요' : NET === 'ok' ? '실시간 연결됨' : '연결 중…'} · 채점 대기 ${docs.filter(d => d.finishedAtMs && typeof d.sentenceScore !== 'number').length}팀 · 점수를 누르면 학생 화면에 바로 떠요</p></div>${cards || '<div class="card muted">아직 이 반에서 시작한 모둠이 없어요.</div>'}`;
}
function tickTimers() {
  document.querySelectorAll('[data-timer]').forEach(el => { const st = +el.dataset.st; el.textContent = st ? mmss((Date.now() - st) / 1000 - (+el.dataset.db || 0)) : '-'; });
}
setInterval(() => { if (MODE === 'teacher' && TEACH.ok) tickTimers(); }, 1000);

/* ---------------- 진행 ---------------- */
function startTeam(cls, team, size) { S = newTeam(cls, team, size); persist(); }
function go(step) { S.step = step; S.tmp = null; persist(); }
function nextCell() {
  S.cell++; S.mi = 0; S.qi = 0; S.tmp = null;
  if (S.cell >= CELLS.length) { S.cell = CELLS.length - 1; S.phase = 'sentence'; S.step = 'done'; burst(); } else S.step = 'situation';
  persist();
}
let rolling = false;
function roll() {
  if (rolling || S.dice[S.cell]) return; rolling = true;
  const el = document.getElementById('die'); let n = 0;
  const t = setInterval(() => {
    el.classList.add('roll'); sfx('dice'); el.textContent = '🎲 ' + (1 + Math.floor(Math.random() * 6));
    if (++n >= 10) {
      clearInterval(t); rolling = false;
      const v = 1 + Math.floor(Math.random() * 6); S.dice[S.cell] = v; S.diceBonus += v * SCORE.diceSec; sfx('win'); persist(); render();
    }
  }, 90);
}
function afterText(len) { S.texts.push(len); }

$app.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'pin') { const bt = document.querySelector('[data-act=tpin]'); if (bt) bt.click(); } });
function updCnt(ta) {
  if (!ta || !ta.dataset.min) return; const m = +ta.dataset.min, n = ta.value.trim().length; let c = document.getElementById('cnt');
  if (!c) { c = document.createElement('div'); c.id = 'cnt'; ta.insertAdjacentElement('afterend', c); }
  c.className = 'cnt' + (n >= m ? ' ok' : ''); c.textContent = n >= m ? '✓ 좋아요! 제출할 수 있어요' : n + ' / ' + m + '자 · ' + (m - n) + '자만 더 써 볼까요?';
}
$app.addEventListener('input', e => {
  const ta = e.target.closest('textarea[data-min],input[data-min]'); if (ta) updCnt(ta);
  if (ta) { if (S && S.phase === 'board' && S.step === 'stance') checkStanceReady(); else { const b = document.getElementById('sub'); if (b) b.disabled = ta.value.trim().length < +ta.dataset.min; } }
  const tv = e.target.closest('[data-tv]'); if (tv) TV[tv.dataset.tv] = tv.value;
});
function checkStanceReady() {
  const ta = document.getElementById('ta'), b = document.getElementById('sub');
  if (ta && b && S && S.step === 'stance') b.disabled = !(window.__opt != null && ta.value.trim().length >= SCORE.minLen);
}
$app.addEventListener('change', e => {
  if (e.target.id === 'f-cls') { const v = e.target.value, t = v === '99'; const ft = document.getElementById('f-team'); if (ft && !t) ft.innerHTML = teamOpts(v);
    const wt = document.getElementById('w-team'), ws = document.getElementById('w-size'); if (wt) wt.style.display = t ? 'none' : ''; if (ws) ws.style.display = (t || GROUP_SIZES[v]) ? 'none' : ''; }
  if (e.target.id === 't-cls') { TEACH.cls = e.target.value; listenClass(TEACH.cls, render); CLASSDOCS = []; render(); }
});

$app.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, i = +el.dataset.i;
  /* 시작/교사 */
  if (a === 'start') {
    const cls = document.getElementById('f-cls').value, team = document.getElementById('f-team').value, size = sizeOf(cls, team) || document.getElementById('f-size').value;
    if (cls === '99') { startTeam('99', '1', 5); S.members = ['prince', 'yangban', 'merchant', 'farmer', 'slave'].map((k, n) => ({ card: 13 - n, key: k, label: ROLES[k].label })); S.phase = 'team'; persist(); MODE = 'student'; return render(); }
    let saved = null; try { saved = JSON.parse(localStorage.getItem('timelap2_' + tid(cls, team))); } catch (er) {}
    if (saved && saved.phase) { TV.resume = saved; TV.pending = { cls, team, size }; MODE = 'resume'; return render(); }
    const ros = await loadRoster(cls);
    startTeam(cls, team, size); S.roster = ros && ros[+team - 1] ? ros[+team - 1] : null; S.cardName = {}; return render();
  }
  if (a === 'resume') { S = TV.resume; MODE = 'student'; if (S.phase === 'wait') listenClass(S.cls, render); return render(); }
  if (a === 'restart') { const p = TV.pending; MODE = 'student'; const ros = await loadRoster(p.cls); startTeam(p.cls, p.team, p.size); S.roster = ros && ros[+p.team - 1] ? ros[+p.team - 1] : null; S.cardName = {}; return render(); }
  if (a === 'home') { MODE = 'start'; S = null; return render(); }
  if (a === 'tlogin') { MODE = 'teacher'; TEACH.ok = false; return render(); }
  if (a === 'tpin') { if (document.getElementById('pin').value === TEACHER_PIN) { TEACH.ok = true; listenClass(TEACH.cls, render); return render(); } document.getElementById('f-err').style.display = 'block'; return; }
  if (a === 'tq') { const inp = document.getElementById('sc-' + el.dataset.id); inp.value = el.dataset.v; TV[el.dataset.id] = el.dataset.v; return; }
  if (a === 'tscore') {
    const v = clamp(Math.round(+document.getElementById('sc-' + el.dataset.id).value), 0, 30);
    delete TV[el.dataset.id];
    const d = CLASSDOCS.find(x => x.id === el.dataset.id); if (d) d.sentenceScore = v; render();
    await remoteSet(el.dataset.id, { sentenceScore: v, scoredAtMs: Date.now() }); return;
  }
  if (!S) return;
  /* 카드·신분 */
  if (a === 'pickname') { S.curName = el.dataset.n; persist(); return render(); }
  if (a === 'flip') { if (S.flipped.includes(i) || S.flipped.length >= S.size) return; if (S.roster && !S.curName) return; if (S.curName) { S.cardName = S.cardName || {}; S.cardName[i] = S.curName; S.curName = null; } S.flipped.push(i); persist(); return render(); }
  if (a === 'toroles') { S.phase = 'roles'; persist(); return render(); }
  if (a === 'role') { pickRole(+el.dataset.idx); persist(); return render(); }
  if (a === 'introok') { S.introSeen = true; persist(); return render(); }
  if (a === 'startgame') { S.phase = 'board'; S.startedAtMs = Date.now(); S.step = 'situation'; persist(true); return render(); }
  /* 보드 */
  if (a === 'torun') { if (RG) RG.stop = true; S.ri = 0; go('runintro'); return render(); }
  if (a === 'ri_next') { S.ri = (S.ri || 0) + 1; persist(); return render(); }
  if (a === 'ri_go') { go('run'); return render(); }
  if (a === 'run_go') { if (RG) RG.go(); return; }
  if (a === 'run_retry') { if (RG) RG.retry(); return; }
  if (a === 'run_done') { DG = null; go('dig'); return render(); }
  if (a === 'totrial') { S.qi = 0; S.tw = 0; go('trial'); return render(); }
  if (a === 'tr_pm') { S.tmp.pick[+el.dataset.r] = +el.dataset.k; S.tmp.msg = ''; persist(); return render(); }
  if (a === 'tr_ev') { const T = S.tmp, id = el.dataset.id, R = CELLS[S.cell].trial.rounds[S.qi], k = T.sel.indexOf(id); if (k >= 0) T.sel.splice(k, 1); else if (T.sel.length < R.pick) T.sel.push(id); T.msg = ''; persist(); return render(); }
  if (a === 'tr_check') {
    const R = CELLS[S.cell].trial.rounds[S.qi], T = S.tmp;
    const ok = R.type === 'match' ? R.pairs.every((pr, r) => R.choices[T.pick[r]] === pr[1]) : R.ans.every(x => T.sel.includes(x)) && T.sel.length === R.ans.length;
    if (ok) { T.solved = true; S.mcTotal++; T.judge = JUDGE_OK[Math.random() * 3 | 0] + ' ' + JAPAN_LOSE[Math.random() * 3 | 0]; }
    else { S.wrong++; S.tw = (S.tw || 0) + 1; T.msg = JUDGE_NO[Math.random() * 3 | 0]; if (R.type === 'match') T.pick = R.pairs.map(() => -1); else T.sel = []; }
    persist(); return render();
  }
  if (a === 'tr_short') {
    const R = CELLS[S.cell].trial.rounds[S.qi], T = S.tmp, v = document.getElementById('ta').value.trim();
    if (R.key.some(k => v.includes(k))) { T.solved = true; T.val = v; S.mcTotal++; T.judge = JUDGE_OK[Math.random() * 3 | 0]; }
    else { S.wrong++; S.tw = (S.tw || 0) + 1; T.msg = JUDGE_NO[Math.random() * 3 | 0] + ' ' + (R.hint || ''); }
    persist(); return render();
  }
  if (a === 'tr_text') {
    const R = CELLS[S.cell].trial.rounds[S.qi], asker = askerFor(trialLevel(R), S.cell, S.qi), txt = document.getElementById('ta').value.trim();
    S.log.push({ cell: S.cell, k: 'q', level: '변론 ' + (S.qi + 1), who: asker.label, a: txt }); afterText(txt.length);
    S.tmp.solved = true; S.tmp.judge = R.judge || ''; persist(); return render();
  }
  if (a === 'tr_next') { S.qi++; if (S.qi >= CELLS[S.cell].trial.rounds.length) go('verdict'); else { S.tmp = null; persist(); } return render(); }
  if (a === 'tr_done') { DG = null; go('dig'); return render(); }
  if (a === 'tomine') { if (G3) G3.stop = true; MINE_KEYS = {}; MINE_POS = [50, 67]; MINE_TARGET = null; MINE_AUTO = -1; mineBusy = false; go('mine'); return render(); }
  if (a === 'dig') { const k = +el.dataset.i; if (mineBusy) return; if (nearRock() === k) return mineAct(k); const rx = ROCKS[k][0], ry = ROCKS[k][1]; MINE_AUTO = k; MINE_TARGET = [rx < 50 ? Math.min(rx + 9, 92) : Math.max(rx - 9, 8), Math.min(ry + 4, 92)]; return; }
  if (a === 'mdig') { const n = nearRock(); if (n >= 0) mineAct(n); return; }
  if (a === 'walk') { const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 100, y = (e.clientY - r.top) / r.height * 100; if (isFinite(x) && isFinite(y) && !inMon(x, y)) { MINE_AUTO = -1; MINE_TARGET = [clamp(x, 4, 96), clamp(y, 8, 94)]; } return; }
  if (a === 'minedone') { DG = null; go('dig'); return render(); }
  if (a === 'torice') { RICE = null; go('rice'); return render(); }
  if (a === 'rice_next') { const R = RICE, L = R.scene === 'intro' ? RICE_L1 : RICE_L2; if (R.i < L.length - 1) R.i++; else if (R.scene === 'intro') R.scene = 'sort'; else R.scene = 'reveal'; riceDraw(); return; }
  if (a === 'rice_jar') { riceJar(el.dataset.t); return; }
  if (a === 'ricedone') { DG = null; go('dig'); return render(); }
  if (a === 'tostance') { S.mi = 0; window.__opt = null; go('stance'); return render(); }
  if (a === 'opt') { window.__opt = i; document.querySelectorAll('.opt').forEach(b => b.classList.remove('sel')); el.classList.add('sel'); checkStanceReady(); return; }
  if (a === 'stancesub') {
    const m = S.members[S.mi], c = CELLS[S.cell], txt = document.getElementById('ta').value.trim();
    S.log.push({ cell: S.cell, k: 'stance', key: m.key, who: m.label, opt: c.stance.opts[window.__opt], a: txt }); afterText(txt.length);
    window.__opt = null; S.mi++; if (S.mi >= S.members.length) go('stancesum'); else persist(); return render();
  }
  if (a === 'tosource') { DG = null; go(CELLS[S.cell].dig ? 'dig' : 'source'); return render(); }
  if (a === 'todig') { DG = null; go('dig'); return render(); }
  if (a === 'ddig') { digAct(); return; }
  if (a === 'digdone') { DG = null; S.qi = 0; go('q'); return render(); }
  if (a === 'toq') { S.qi = 0; go('q'); return render(); }
  if (a === 'mc') {
    const o = S.tmp.opts[i]; if (o.ok) { S.tmp.solved = true; S.mcTotal++; } else { S.tmp.bad.push(i); S.wrong++; } persist(); return render();
  }
  if (a === 'mt') { const T = S.tmp, k = T.sel.indexOf(i), need = CELLS[S.cell].qs[S.qi].pick; if (k >= 0) T.sel.splice(k, 1); else if (T.sel.length < need) T.sel.push(i); T.msg = ''; persist(); return render(); }
  if (a === 'mcheck') { const T = S.tmp; if (T.sel.every(j => T.opts[j].ok)) { T.solved = true; S.mcTotal++; } else { S.wrong++; T.sel = []; T.msg = '앗, 다시 생각해 봐요!'; } persist(); return render(); }
  if (a === 'pm') { S.tmp.pick[+el.dataset.r] = +el.dataset.k; S.tmp.msg = ''; persist(); return render(); }
  if (a === 'pcheck') { const q = CELLS[S.cell].qs[S.qi], T = S.tmp; if (q.pairs.every((pr, r) => q.choices[T.pick[r]] === pr[1])) { T.solved = true; S.mcTotal++; } else { S.wrong++; T.pick = q.pairs.map(() => -1); T.msg = '앗, 다시 생각해 봐요!'; } persist(); return render(); }
  if (a === 'qsub' || a === 'qnext') {
    const c = CELLS[S.cell], q = c.qs[S.qi], asker = askerFor(q.level, S.cell, S.qi);
    if (a === 'qsub') { const txt = document.getElementById('ta').value.trim(); S.log.push({ cell: S.cell, k: 'q', level: q.level, who: asker.label, a: txt }); if (!q.short) afterText(txt.length); }
    S.qi++; if (S.qi >= c.qs.length) go('dice'); else { S.tmp = null; persist(); } return render();
  }
  if (a === 'roll') return roll();
  if (a === 'nextcell') { nextCell(); return render(); }
  if (a === 'sentsub') {
    S.sentence = document.getElementById('ta').value.trim(); S.finishedAtMs = Date.now(); S.phase = 'wait'; persist(true); listenClass(S.cls, render); burst(); return render();
  }
});

/* 신분 확정 후 팀 소개 화면 */
function vTeam() {
  return `<div class="title"><h2>🎒 우리 모둠의 모험가들</h2></div><div class="card"><ul class="list">${S.members.map(m => `<li>${ROLES[m.key].em} <b>${m.label}</b> <span class="muted">(카드 ${m.card})</span></li>`).join('')}</ul>
  <p class="muted">${LESSON.no}차시 「${esc(LESSON.title)}」 · 총 ${CELLS.length}칸. 같은 사건도 신분마다 다르게 느껴질 거예요. 시간과 정확도, 마지막 한 문장으로 순위가 정해져요!</p>
  <button class="btn" data-act="startgame">모험 시작 🚩</button></div>`;
}
/* 열린 주소에 ?teacher 가 있으면 교사용 화면 */
if (/[?&]teacher/.test(location.search)) { MODE = 'teacher'; }
window.__tl = { get S() { return S; }, set S(v) { S = v; }, render, askerFor, get DG() { return DG; } };
render();
</script>
